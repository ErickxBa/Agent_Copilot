name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q src tests

      - name: Validate fixture JSON
        run: |
          python -c "import json; from pathlib import Path; [json.loads(p.read_text(encoding='utf-8')) for p in [*Path('data').rglob('*.json'), *Path('data').rglob('*.txt')]]"

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
